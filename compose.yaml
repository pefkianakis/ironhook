services:
  postgres:
    image: postgres:18.6-alpine
    container_name: ironhook-postgres
    environment:
      POSTGRES_USER: ironhook
      POSTGRES_PASSWORD: ironhook
      POSTGRES_DB: ironhook
    ports:
      - "5432:5432"
    volumes:
      - ironhook-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironhook -d ironhook"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ironhook-postgres-data: